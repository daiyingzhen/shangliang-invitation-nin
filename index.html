<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --red: #A63A2E;
    --red-deep: #8C2B21;
    --red-bright: #B54434;
    --gold: #C9A063;
    --gold-deep: #A87F3F;
    --gold-light: #E9C48A;
    --ink: #4A3428;
    --ink-soft: #7C685C;
    --cream: #FFF3E0;
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #FBF4E4 0%, #F5EDDD 55%, #EEE1CA 100%);
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
    position: relative;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(166, 58, 46, .18); }

  /* ---------- 背景写意圆环 ---------- */
  .bg-enso {
    position: fixed; left: 50%; top: 50%; z-index: 0; pointer-events: none;
    width: 62vmin; height: 62vmin; border-radius: 50%;
    transform: translate(-50%, -50%);
    border: 1.5px solid #A63A2E; border-color: rgba(166, 58, 46, .07);
  }
  .bg-enso.o2 { width: 86vmin; height: 86vmin; border-color: rgba(201, 160, 99, .09); border-width: 1px; }

  /* ---------- 漂浮灯笼 ---------- */
  .lantern { position: fixed; top: 0; z-index: 1; transform-origin: top center; animation: sway 4.6s ease-in-out infinite; }
  .lantern.l { left: 5vw; }
  .lantern.r { right: 5vw; animation-delay: -2.3s; }
  .lantern svg { width: 40px; height: auto; display: block; filter: drop-shadow(0 8px 16px rgba(140, 43, 33, .25)) drop-shadow(0 0 14px rgba(255, 190, 120, .18)); }
  @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

  /* ---------- 飘落花瓣 ---------- */
  .petals { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .petals i {
    position: absolute; top: -24px;
    width: var(--s); height: var(--s);
    background: var(--c);
    border-radius: 60% 0 60% 0;
    opacity: 0;
    animation: petal-fall var(--t) linear var(--d) infinite;
  }
  @keyframes petal-fall {
    0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
    8% { opacity: .72; }
    40% { transform: translate3d(5vw, 42vh, 0) rotate(140deg); }
    70% { transform: translate3d(-4vw, 72vh, 0) rotate(250deg); }
    100% { transform: translate3d(3vw, 112vh, 0) rotate(360deg); opacity: 0; }
  }

  /* ---------- 请帖卡片 ---------- */
  .card {
    position: relative; z-index: 2;
    width: 100%; max-width: 520px;
    background: linear-gradient(180deg, #FFFDF6 0%, #FBF3E2 100%);
    border-radius: 22px;
    text-align: center;
    box-shadow: 0 34px 80px -34px rgba(122, 60, 32, .38), 0 3px 12px rgba(122, 60, 32, .08);
    overflow: hidden;
    animation: card-in .8s cubic-bezier(.22, .9, .3, 1) both;
  }
  @keyframes card-in { from { opacity: 0; transform: translateY(26px) scale(.98); } to { opacity: 1; transform: none; } }

  /* 宣纸颗粒 */
  .grain { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; opacity: .5; }

  /* ---------- 顶部红色帷幔 ---------- */
  .banner {
    position: relative; z-index: 1;
    padding: 46px 30px 30px;
    background:
      radial-gradient(ellipse 130% 95% at 50% 0%, rgba(255, 216, 152, .16), transparent 62%),
      linear-gradient(180deg, #6B1D17 0%, #8C2B21 58%, #A63A2E 100%);
    border-radius: 22px 22px 0 0;
    overflow: hidden;
  }
  .banner::before {
    content: ""; position: absolute; inset: 12px; z-index: 2;
    border: 1px solid #E9C48A; border-color: rgba(233, 196, 138, .45); border-radius: 12px; pointer-events: none;
  }
  .banner::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; z-index: 2;
    background: linear-gradient(90deg, transparent, rgba(233, 196, 138, .9) 20%, rgba(233, 196, 138, .9) 80%, transparent);
  }

  /* 水墨晕染 */
  .wash { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

  /* 福字水印 */
  .bg-fu {
    position: absolute; left: 50%; top: 44%; z-index: 0;
    transform: translate(-50%, -50%);
    font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
    font-size: min(190px, 52vw);
    font-weight: 700;
    color: #FFF0D6; color: rgba(255, 240, 214, .06);
    pointer-events: none; user-select: none;
    animation: fu-breathe 9s ease-in-out infinite;
  }
  @keyframes fu-breathe { 0%, 100% { opacity: .8; } 50% { opacity: 1.25; } }

  /* 卷草角花 */
  .curl { position: absolute; width: 34px; height: 34px; z-index: 3; pointer-events: none; }
  .curl.tl { top: 13px; left: 13px; }
  .curl.tr { top: 13px; right: 13px; transform: scaleX(-1); }
  .curl.bl { bottom: 13px; left: 13px; transform: scaleY(-1); }
  .curl.br { bottom: 13px; right: 13px; transform: scale(-1, -1); }

  /* 侧排对联 */
  .couplet {
    position: absolute; top: 50%; z-index: 2;
    transform: translateY(-50%);
    writing-mode: vertical-rl;
    font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
    font-size: 12px; letter-spacing: .42em;
    color: #E9C48A; color: rgba(233, 196, 138, .82);
    pointer-events: none;
  }
  .couplet.l { left: 22px; }
  .couplet.r { right: 22px; }

  .banner-inner { position: relative; z-index: 1; }

  /* ---------- 头部：屋脊披红 ---------- */
  .roof { width: 190px; height: auto; margin: 2px auto 0; display: block; filter: drop-shadow(0 0 12px rgba(255, 200, 130, .22)); }
  .ribbon { transform-origin: 110px 22px; animation: sway-ribbon 3.6s ease-in-out infinite; }
  @keyframes sway-ribbon { 0%, 100% { transform: rotate(-3.5deg); } 50% { transform: rotate(3.5deg); } }

  .eyebrow {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-top: 14px;
    color: var(--gold-light); font-size: 13px; letter-spacing: .38em;
  }
  /* 抵消 letter-spacing 尾部空隙，保证居中对齐 */
  .eyebrow .et { margin-right: -0.38em; }
  .eyebrow::before, .eyebrow::after { content: ""; width: 30px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-light)); }
  .eyebrow::after { background: linear-gradient(90deg, var(--gold-light), transparent); }

  h1 {
    font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
    color: #FAF0DC;
    font-size: clamp(30px, 8.4vw, 39px);
    font-weight: 700;
    letter-spacing: .14em;
    line-height: 1.5;
    margin-top: 12px;
    text-shadow: 0 1px 3px rgba(70, 12, 6, .28), 0 0 26px rgba(255, 205, 130, .18);
  }
  h1 .line { display: flex; align-items: center; justify-content: center; gap: 15px; }
  /* 抵消 letter-spacing 在末字后产生的空隙，保证文字与两侧星饰真正居中对齐 */
  h1 .t { margin-right: -0.56em; }
  .spark { width: 12px; height: 12px; color: var(--gold-light); flex: none; animation: twinkle 2.6s ease-in-out infinite; }
  .spark.b { animation-delay: 1.3s; }
  @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.12); } }

  .divider { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 16px 0 0; }
  .divider span { width: 58px; height: 1px; background: linear-gradient(90deg, transparent, rgba(233, 196, 138, .95)); }
  .divider span:last-child { background: linear-gradient(90deg, rgba(233, 196, 138, .95), transparent); }
  .divider i { width: 7px; height: 7px; background: var(--gold-light); transform: rotate(45deg); flex: none; }

  /* ---------- 远山淡水（卡片底部） ---------- */
  .mountains { position: absolute; left: 0; bottom: 0; width: 100%; height: 170px; z-index: 0; pointer-events: none; }

  /* ---------- 下部米白主体 ---------- */
  .body { position: relative; z-index: 1; padding: 28px 28px 34px; }
  /* 主体区淡祥云底纹 */
  .body-pattern { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .body-inner { position: relative; z-index: 1; }

  .message { max-width: 400px; margin: 0 auto; color: var(--ink-soft); font-size: 15px; line-height: 2.1; }
  .message .lead { color: var(--ink); font-size: 15.5px; margin-bottom: 4px; }

  .details { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .detail-block { text-align: center; }
  .detail-label { font-size: 11.5px; color: var(--gold-deep); letter-spacing: .32em; margin-bottom: 6px; }
  .detail-main {
    font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
    font-size: 16px; color: var(--ink); font-weight: 600; line-height: 1.65; letter-spacing: .02em;
  }
  .detail-main em { font-style: normal; color: var(--red); font-weight: 700; margin-left: 6px; }
  .detail-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; letter-spacing: .14em; }
  .ornament-divider { width: 230px; height: 18px; display: block; margin: 0 auto; }

  .countdown {
    margin-top: 22px;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 20px; border-radius: 999px;
    background: linear-gradient(135deg, var(--red-bright), var(--red-deep));
    color: var(--cream); font-size: 13px; letter-spacing: .1em;
    box-shadow: 0 8px 18px -8px rgba(140, 43, 33, .6), inset 0 0 0 1px rgba(233, 196, 138, .35);
  }
  .countdown svg { width: 13px; height: 13px; }

  .actions { margin-top: 24px; display: flex; gap: 12px; justify-content: center; }
  .btn {
    flex: 1; max-width: 178px; height: 48px;
    border: none; border-radius: 999px;
    font-size: 15px; letter-spacing: .1em;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer; text-decoration: none;
    transition: transform .15s ease, box-shadow .15s ease;
    touch-action: manipulation;
    font-family: inherit;
  }
  .btn:active { transform: scale(.96); }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .btn-primary {
    background: linear-gradient(135deg, var(--red-bright), var(--red-deep));
    color: var(--cream);
    box-shadow: 0 12px 26px -12px rgba(140, 43, 33, .65), inset 0 0 0 1px rgba(233, 196, 138, .38);
  }
  .btn-ghost {
    background: rgba(255, 253, 246, .55);
    color: var(--red-deep);
    border: 1px solid rgba(168, 127, 63, .5);
  }
  .btn-ghost:active { background: rgba(166, 58, 46, .06); }

  .waiting {
    margin-top: 32px;
    font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
    font-size: 19px; color: var(--red-deep); letter-spacing: .26em; text-indent: .26em;
  }
  .host-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 16px; }
  .host-row .l { width: 46px; height: 1px; background: rgba(201, 160, 99, .75); }
  .host { font-size: 15px; color: var(--ink); letter-spacing: .16em; }

  .seal {
    margin: 26px auto 0;
    width: 64px; height: 64px;
    border-radius: 13px 9px 15px 10px;
    background: radial-gradient(circle at 30% 25%, var(--red-bright), var(--red-deep) 72%);
    color: var(--cream);
    display: flex; align-items: center; justify-content: center;
    font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
    font-size: 19px; font-weight: 700; line-height: 1.28; letter-spacing: .04em;
    transform: rotate(-5deg);
    box-shadow: inset 0 0 0 2.5px rgba(255, 243, 224, .92), inset 0 0 16px rgba(140, 43, 33, .55), 0 5px 16px -5px rgba(140, 43, 33, .5);
    animation: stamp .6s cubic-bezier(.3, 1.6, .5, 1) 1s both;
  }
  @keyframes stamp {
    0% { opacity: 0; transform: rotate(-15deg) scale(1.7); }
    60% { opacity: 1; transform: rotate(-5deg) scale(.94); }
    100% { opacity: 1; transform: rotate(-5deg) scale(1); }
  }

  /* ---------- 公共交通弹层 ---------- */
  .modal-mask {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(62, 36, 26, .48);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center;
    padding: 28px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .modal-mask.show { opacity: 1; pointer-events: auto; }
  .modal {
    position: relative; width: 100%; max-width: 300px;
    background: linear-gradient(180deg, #FFFDF6, #FBF3E2);
    border-radius: 16px;
    padding: 28px 22px 22px;
    text-align: center;
    box-shadow: 0 24px 60px -18px rgba(60, 20, 10, .55), inset 0 0 0 1px rgba(201, 160, 99, .4);
    transform: scale(.92) translateY(12px);
    transition: transform .28s cubic-bezier(.22, .9, .3, 1);
  }
  .modal-mask.show .modal { transform: none; }
  .modal-close {
    position: absolute; top: 6px; right: 10px;
    border: none; background: none; cursor: pointer;
    font-size: 20px; line-height: 1; color: var(--ink-soft);
    padding: 8px 6px; touch-action: manipulation;
  }
  .modal-icon {
    width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(135deg, var(--red-bright), var(--red-deep));
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 16px -6px rgba(140, 43, 33, .55);
  }
  .modal-icon svg { width: 21px; height: 21px; stroke: var(--cream); }
  .modal-title {
    margin-top: 12px;
    font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
    font-size: 17px; color: var(--red-deep); font-weight: 700; letter-spacing: .12em;
  }
  .bus-lines { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .bus-line {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 14px; text-align: left;
    background: rgba(166, 58, 46, .05);
    border: 1px solid rgba(166, 58, 46, .13);
    border-radius: 10px;
  }
  .bus-line svg { width: 15px; height: 15px; stroke: var(--red); flex: none; }
  .bus-line span { font-size: 14.5px; color: var(--ink); font-weight: 600; letter-spacing: .04em; }
  .modal-note { margin-top: 14px; font-size: 12px; color: var(--ink-soft); letter-spacing: .06em; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; z-index: 20;
    bottom: calc(38px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(16px);
    background: rgba(59, 42, 36, .92); color: var(--cream);
    padding: 10px 22px; border-radius: 999px; font-size: 13.5px; letter-spacing: .04em;
    opacity: 0; pointer-events: none; transition: all .3s ease;
    max-width: 82vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- 入场节奏 ---------- */
  .rise { animation: rise .7s ease-out both; }
  .d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .45s; }
  .d4 { animation-delay: .6s; } .d5 { animation-delay: .75s; } .d6 { animation-delay: .9s; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  @media (max-width: 400px) {
    .banner { padding: 38px 20px 26px; }
    .roof { width: 152px; }
    .couplet { font-size: 11px; }
    .couplet.l { left: 16px; } .couplet.r { right: 16px; }
    .curl { width: 30px; height: 30px; }
    .bg-fu { font-size: min(160px, 54vw); }
    .body { padding: 24px 20px 30px; }
    .lantern svg { width: 34px; }
    .lantern.l { left: 2vw; } .lantern.r { right: 2vw; }
    .message { font-size: 14px; }
    .ornament-divider { width: 190px; }
    .btn { max-width: none; font-size: 14.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <!-- 背景写意圆环 -->
  <div class="bg-enso" aria-hidden="true"></div>
  <div class="bg-enso o2" aria-hidden="true"></div>

  <!-- 漂浮灯笼 -->
  <div class="lantern l" aria-hidden="true">
    <svg viewBox="0 0 44 66" fill="none">
      <path d="M22 0 V7" stroke="#C9A063" stroke-width="1.4"/>
      <rect x="14.5" y="6" width="15" height="4" rx="1.2" fill="#C9A063"/>
      <ellipse cx="22" cy="27" rx="14" ry="15.5" fill="#B54434"/>
      <ellipse cx="17" cy="27" rx="8" ry="15.5" fill="#FFFFFF" fill-opacity=".14"/>
      <path d="M9.5 14.5 Q22 27 9.5 39.5 M34.5 14.5 Q22 27 34.5 39.5" stroke="#FFF0DC" stroke-opacity=".28" stroke-width="1.2" fill="none"/>
      <rect x="14.5" y="42" width="15" height="4" rx="1.2" fill="#C9A063"/>
      <path d="M22 46 V56" stroke="#C9A063" stroke-width="1.4"/>
      <path d="M17.5 53 q4.5 7 9 0" stroke="#C9A063" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="lantern r" aria-hidden="true">
    <svg viewBox="0 0 44 66" fill="none">
      <path d="M22 0 V7" stroke="#C9A063" stroke-width="1.4"/>
      <rect x="14.5" y="6" width="15" height="4" rx="1.2" fill="#C9A063"/>
      <ellipse cx="22" cy="27" rx="14" ry="15.5" fill="#B54434"/>
      <ellipse cx="17" cy="27" rx="8" ry="15.5" fill="#FFFFFF" fill-opacity=".14"/>
      <path d="M9.5 14.5 Q22 27 9.5 39.5 M34.5 14.5 Q22 27 34.5 39.5" stroke="#FFF0DC" stroke-opacity=".28" stroke-width="1.2" fill="none"/>
      <rect x="14.5" y="42" width="15" height="4" rx="1.2" fill="#C9A063"/>
      <path d="M22 46 V56" stroke="#C9A063" stroke-width="1.4"/>
      <path d="M17.5 53 q4.5 7 9 0" stroke="#C9A063" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- 飘落花瓣 -->
  <div class="petals" aria-hidden="true">
    <i style="left:5%;--s:10px;--d:0s;--t:11s;--c:#D98E7E"></i>
    <i style="left:14%;--s:7px;--d:3.2s;--t:13s;--c:#E9C48A"></i>
    <i style="left:23%;--s:12px;--d:6.5s;--t:12s;--c:#C95F4D"></i>
    <i style="left:33%;--s:8px;--d:1.8s;--t:14s;--c:#F0D9B8"></i>
    <i style="left:44%;--s:11px;--d:8s;--t:12.5s;--c:#D98E7E"></i>
    <i style="left:56%;--s:7px;--d:4.6s;--t:13.5s;--c:#E9C48A"></i>
    <i style="left:68%;--s:10px;--d:9.5s;--t:11.5s;--c:#C95F4D"></i>
    <i style="left:80%;--s:9px;--d:2.6s;--t:14s;--c:#F0D9B8"></i>
    <i style="left:91%;--s:12px;--d:7.2s;--t:12s;--c:#D98E7E"></i>
  </div>

  <!-- 请帖主体 -->
  <main class="card">

    <!-- 宣纸颗粒 -->
    <svg class="grain" aria-hidden="true">
      <filter id="grainF" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="n"/>
        <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.33  0 0 0 0 0.22  0 0 0 0.05 0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#grainF)"/>
    </svg>

    <!-- 顶部：红色帷幔 -->
    <header class="banner rise d1">

      <!-- 水墨晕染 -->

  <script>
    (function () {
      var ADDRESS = "浙江省杭州市临平区运河街道亭趾村前方桥43号";

      /* 倒计时 */
      var target = new Date("2026-11-07T17:30:00+08:00").getTime();
      var cdText = document.getElementById("countdown-text");
      function tick() {
        var diff = target - Date.now();
        if (diff <= 0) {
          cdText.textContent = "喜宴今日开席 · 恭候光临";
          return;
        }
        var d = Math.floor(diff / 86400000);
        var h = Math.floor((diff % 86400000) / 3600000);
        cdText.textContent = d > 0
          ? "距上梁喜宴还有 " + d + " 天"
          : "距上梁喜宴还有 " + h + " 小时";
      }
      tick();
      setInterval(tick, 60000);

      /* Toast */
      var toast = document.getElementById("toast");
      var toastTimer = null;
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2400);
      }

      /* 复制地址 */
      function onCopied() {
        if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
        showToast("地址已复制，可粘贴到地图搜索");
      }
      function legacyCopy() {
        var ta = document.createElement("textarea");
        ta.value = ADDRESS;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
        if (ok) { onCopied(); } else { showToast("请长按选择复制：" + ADDRESS); }
      }
      document.getElementById("copy-btn").addEventListener("click", function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(ADDRESS).then(onCopied).catch(legacyCopy);
        } else {
          legacyCopy();
        }
      });

      /* 公共交通弹层 */
      var mask = document.getElementById("bus-modal");
      var busBtn = document.getElementById("bus-btn");
      var busClose = document.getElementById("bus-close");
      function closeBus() { mask.classList.remove("show"); }
      if (busBtn) {
        busBtn.addEventListener("click", function () { mask.classList.add("show"); });
      }
      if (busClose) { busClose.addEventListener("click", closeBus); }
      mask.addEventListener("click", function (e) { if (e.target === mask) closeBus(); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeBus(); });
    })();
  </script>
